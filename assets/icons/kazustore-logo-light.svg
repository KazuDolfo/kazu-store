    <path d="M119 13 C119 5.5 123.5 2 129.5 2 C135.5 2 140 5.5 140 13 C140 20.5 135.5 24 129.5 24 C123.5 24 119 20.5 119 13 Z M123.5 13 C123.5 18 126 20.2 129.5 20.2 C133 20.2 135.5 18 135.5 13 C135.5 8 133 5.8 129.5 5.8 C126 5.8 123.5 8 123.5 13 Z" fill="#0284C7"/>
    <!-- R -->
    <path d="M143 2 H152 C156.5 2 159 4.5 159 8.5 C159 11.5 157 13.5 154 14.2 L160 24 H154.5 L149.2 15 H147 V24 H143 Z M147 6 V11.5 H151.5 C153.5 11.5 155 10.5 155 8.7 C155 7 153.5 6 151.5 6 Z" fill="#0284C7"/>
    <!-- E -->
    <path d="M163 2 H176 V6 H167.5 V11 H174 V15 H167.5 V20 H176 V24 H163 Z" fill="#0284C7"/>
  </g>

  <!-- Subtítulo de Garantía Esmeralda Oficial -->
  <g transform="translate(60, 39)">
    <circle cx="2" cy="-2.5" r="2" fill="#059669"/>
    <text x="8" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#059669" letter-spacing="1.4">GARANTÍA DE SERVICIO ACTIVO</text>
  </g>
</svg>
