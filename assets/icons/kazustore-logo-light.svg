    <!-- Z -->
    <path d="M39 2 H52 V6 L44 19.5 H52.5 V24 H38.5 V20 L46.5 6.5 H39 Z" fill="#0C1A30"/>
    <!-- U -->
    <path d="M55 2 H59.5 V15 C59.5 19 62 20.5 65.5 20.5 C69 20.5 71.5 19 71.5 15 V2 H76 V15 C76 21.5 71.5 24.5 65.5 24.5 C59.5 24.5 55 21.5 55 15 Z" fill="#0C1A30"/>

    <!-- STORE (Cyan High-Tech) -->
    <!-- S -->
    <path d="M82 19 C83 22.5 86 24.5 90 24.5 C94 24.5 97 22.5 97 19 C97 14 89.5 14.5 89.5 9.5 C89.5 7 91.5 5.8 94 5.8 C96.5 5.8 98 7 98.8 9 L102 7.5 C100.8 4.2 98 2 94 2 C89.5 2 85.5 4.5 85.5 9.5 C85.5 14.5 93 14 93 19 C93 21 91.5 22 89.5 22 C87 22 85.5 20.5 84.8 18 Z" fill="#0284C7"/>
    <!-- T -->
    <path d="M103 2 H117 V6 H112 V24 H108 V6 H103 Z" fill="#0284C7"/>
