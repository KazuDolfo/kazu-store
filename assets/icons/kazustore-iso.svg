<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Arco del Candado (Cibernético Cyan a Deep Blue) -->
    <linearGradient id="kazuLockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gradiente Play (Esmeralda Confianza a Cyan) -->
    <linearGradient id="kazuPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <!-- Sombra sutil para despegar el Play y evitar empaste visual -->
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Contenedor Base Adaptativo (Dark Shield Background) -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0B0F19"/>

  <!-- Arco Candado Superior (Shackle) -->
  <path d="M34 38 V26 C34 17.16 41.16 10 50 10 C58.84 10 66 17.16 66 26 V38"
        fill="none" stroke="url(#kazuLockGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Cuerpo Candado / Escudo -->
  <rect x="19" y="37" width="62" height="50" rx="12" fill="#111827" stroke="#2563EB" stroke-width="2"/>

  <!-- Letra K: Asta Vertical -->
  <rect x="29" y="47" width="6.5" height="30" rx="3.25" fill="#00F2FE"/>

  <!-- Letra K: Brazo Diagonal Superior -->
  <path d="M35 62 L51 48" fill="none" stroke="#00F2FE" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letra K: Brazo Diagonal Inferior con respiración óptica antes del Play -->
  <path d="M35 62 L50 75" fill="none" stroke="#00F2FE" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Triángulo Play Multimedia (Independiente con bisel de corte y sombra) -->
  <path d="M52 50.5 L73 62 L52 73.5 Z" fill="url(#kazuPlayGrad)" filter="url(#playGlow)"/>
</svg>