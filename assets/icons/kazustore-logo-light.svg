<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" width="250" height="48">
  <defs>
    <linearGradient id="hLockGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="hPlayGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Isotipo Proporcional -->
  <g transform="translate(4, 2) scale(0.44)">
    <!-- Base sutil -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#E0F2FE" stroke="rgba(2,132,199,0.25)" stroke-width="1.5"/>
    <!-- Shackle candado -->
    <path d="M34 38 V26 C34 17.16 41.16 10 50 10 C58.84 10 66 17.16 66 26 V38"
          fill="none" stroke="url(#hLockGradLight)" stroke-width="7" stroke-linecap="round"/>
    <!-- Lock body -->
    <rect x="19" y="37" width="62" height="50" rx="12" fill="#0C1A30" stroke="#1D4ED8" stroke-width="2"/>
    <!-- K vertical -->
    <rect x="29" y="47" width="6.5" height="30" rx="3.25" fill="#38BDF8"/>
    <!-- K diagonales con respiración -->
    <path d="M35 62 L51 48" fill="none" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M35 62 L50 75" fill="none" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Play -->
    <path d="M52 50.5 L73 62 L52 73.5 Z" fill="url(#hPlayGradLight)"/>
  </g>

  <!-- Tipografía Vectorizada KAZU STORE (Azul Noche #0C1A30 + Cyan #0284C7) -->
